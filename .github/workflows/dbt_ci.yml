name: dbt CI

on:
  push:
    branches: [main]
    paths:
      - 'data_analysis_risk/**'
      - '.github/workflows/dbt_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data_analysis_risk/**'
      - '.github/workflows/dbt_ci.yml'

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: credit_risk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt
        run: |
          pip install "dbt-core>=1.7,<2.0" "dbt-postgres>=1.7,<2.0"

      - name: Create dbt profiles directory
        run: mkdir -p ~/.dbt

      - name: Write profiles.yml
        run: |
          cat > ~/.dbt/profiles.yml <<EOF
          risk_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: postgres
                password: postgres
                port: 5432
                dbname: credit_risk
                schema: public
                threads: 4
          EOF

      - name: Create synthetic CSV
        run: |
          mkdir -p data_analysis_risk/data/raw
          cat > data_analysis_risk/data/raw/cs-training.csv <<EOF
          SeriousDlqin2yrs,RevolvingUtilizationOfUnsecuredLines,age,NumberOfTime30-59DaysPastDueNotWorse,DebtRatio,MonthlyIncome,NumberOfOpenCreditLinesAndLoans,NumberOfTimes90DaysLate,NumberRealEstateLoansOrLines,NumberOfTime60-89DaysPastDueNotWorse,NumberOfDependents
          0,0.5,45,0,0.3,5000,5,0,1,0,2
          1,0.8,35,2,0.6,3000,3,1,0,1,1
          0,0.2,50,0,0.2,8000,6,0,2,0,0
          EOF

      - name: Load raw data into PostgreSQL
        run: |
          pip install pandas sqlalchemy psycopg2-binary
          cd data_analysis_risk
          python scripts/load_data.py

      - name: Run dbt
        run: |
          cd data_analysis_risk/dbt/risk_dbt
          dbt run

      - name: Run dbt tests
        run: |
          cd data_analysis_risk/dbt/risk_dbt
          dbt test